<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavadero — Precios y turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="horario">Cargando horario…</p>
      <h1 id="nombre-negocio">Lavadero</h1>
      <p class="hero-sub" id="direccion">Cargando dirección…</p>
    </div>
    <svg class="suds" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,30 Q50,60 100,30 T200,30 T300,30 T400,30 T500,30 T600,30 T700,30 T800,30 T900,30 T1000,30 T1100,30 T1200,30 V60 H0 Z"></path>
    </svg>
  </header>

  <main>
    <p class="section-label">Tocá un servicio para reservar tu turno</p>
    <section class="grid" id="servicios-grid" aria-live="polite">
      <!-- Las tarjetas se generan con script.js a partir de precios.json -->
    </section>

    <section class="map-section">
      <h2>Cómo llegar</h2>
      <div class="map-embed">
        <iframe
          id="map-iframe"
          src=""
          width="100%"
          height="100%"
          style="border:0"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Ubicación del lavadero en Google Maps">
        </iframe>
      </div>
      <a id="map-link" class="map-cta" href="#" target="_blank" rel="noopener noreferrer">
        Abrir en Google Maps
      </a>
    </section>
  </main>

  <footer>
    <p id="footer-nota">Los precios pueden variar sin previo aviso.</p>
    <p id="footer-actualizado"></p>
  </footer>

  <div class="floating-social">
    <a id="whatsapp-link" class="social-btn whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="Escribinos por WhatsApp">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.82 12.04 21.82C17.5 21.82 21.95 17.37 21.95 11.91C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.04 20.15C10.56 20.15 9.11 19.76 7.84 19L7.54 18.82L4.42 19.64L5.26 16.6L5.06 16.29C4.22 14.97 3.78 13.46 3.78 11.91C3.78 7.36 7.48 3.66 12.05 3.66C14.26 3.66 16.33 4.52 17.89 6.08C19.45 7.64 20.31 9.71 20.3 11.91C20.3 16.46 16.59 20.15 12.04 20.15ZM16.56 13.97C16.31 13.85 15.11 13.25 14.88 13.17C14.65 13.08 14.48 13.04 14.31 13.29C14.14 13.54 13.66 14.11 13.51 14.28C13.36 14.45 13.22 14.47 12.97 14.35C12.72 14.22 11.93 13.96 11 13.13C10.27 12.48 9.78 11.68 9.63 11.43C9.48 11.18 9.6 11.04 9.72 10.92C9.83 10.81 9.97 10.62 10.1 10.47C10.23 10.32 10.27 10.21 10.36 10.04C10.44 9.87 10.4 9.72 10.34 9.6C10.27 9.48 9.78 8.28 9.58 7.79C9.38 7.31 9.18 7.38 9.03 7.37C8.89 7.36 8.72 7.36 8.55 7.36C8.38 7.36 8.11 7.42 7.88 7.67C7.65 7.92 7 8.53 7 9.72C7 10.92 7.9 12.08 8.02 12.24C8.14 12.4 9.78 14.93 12.29 15.99C12.89 16.24 13.36 16.39 13.72 16.5C14.32 16.69 14.87 16.66 15.31 16.6C15.8 16.53 16.81 15.99 17.02 15.4C17.23 14.81 17.23 14.31 17.17 14.2C17.11 14.09 16.94 14.03 16.56 13.97Z" fill="white"/>
      </svg>
    </a>
    <a id="instagram-link" class="social-btn instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Seguinos en Instagram">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="white" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.2" stroke="white" stroke-width="1.8"/>
        <circle cx="17.4" cy="6.6" r="1.15" fill="white"/>
      </svg>
    </a>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
